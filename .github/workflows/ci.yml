name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送會取消仍在執行的舊工作
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # 同時建置 EduPrompt（index.html）與 Green Track（greentrack.html）
      - name: Build
        run: npm run build
